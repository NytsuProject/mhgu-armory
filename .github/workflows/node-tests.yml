name: Node tests

on:
  push:
    branches:
      - balance/bow-elemental-stage5
  pull_request:
    branches:
      - main

# Push and pull_request events for the same head commit share one CI run.
concurrency:
  group: bow-stage5-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite
        run: npm test

      - name: Run full bow balance matrix smoke test
        run: |
          curl -fsSL "https://raw.githubusercontent.com/ArmoredRaven17/MHGU-Monster-Info/2553eb6627fbf73803d83bf10f2deb619b7f4a03/docs/data/hitzones.js" -o "$RUNNER_TEMP/mhgu-hitzones.js"
          node tools/bow-balance-sim.mjs --hitzones "$RUNNER_TEMP/mhgu-hitzones.js" --out "$RUNNER_TEMP/bow-balance-stage5.json" --load-up-policy match-c3 --shots-per-stack 100 --skill-budgets 5,6,7 > "$RUNNER_TEMP/bow-balance-stage5.log"
          node -e "const r=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); if(r.meta.monsterCount!==93) throw new Error('Expected 93 large monsters'); if(!r.matchups.length || !r.summary.length) throw new Error('Empty bow balance matrix'); console.log('Verified '+r.matchups.length+' matchup rows and '+r.summary.length+' summaries across '+r.meta.monsterCount+' large monsters.'); const rows=r.summary.filter(x=>x.skillBudget===7); const groups={}; for(const x of rows){const k=[x.rank,x.shotType,x.chargeScenario,x.coatingScenario].join('/'); const g=groups[k]||(groups[k]={n:0,w:0,r:0,fn:0,fw:0,fr:0}); g.n+=x.matchups; g.w+=x.elementalWins; g.r+=x.meanElementToRawRatio*x.matchups; g.fn+=x.favorable25Plus.count; g.fw+=x.favorable25Plus.elementalWins; g.fr+=(x.favorable25Plus.meanRatio||0)*x.favorable25Plus.count;} for(const [k,g] of Object.entries(groups)) console.log(k+' ratio='+ (g.r/g.n).toFixed(3)+' wins='+g.w+'/'+g.n+' | fav25+ ratio='+ (g.fn? (g.fr/g.fn).toFixed(3):'n/a')+' wins='+g.fw+'/'+g.fn);" "$RUNNER_TEMP/bow-balance-stage5.json"


      - name: Run detailed monster matrix with Guild style
        run: |
          node tools/bow-elemental-scenarios.mjs --hitzones="$RUNNER_TEMP/mhgu-hitzones.js" --style=guild --monster-summary > "$RUNNER_TEMP/bow-elemental-monsters-guild.json"
          node -e "const r=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); if(r.metadata.largeMonsters!==93 || r.results.length!==279) throw new Error('Expected 93 monsters × 3 ranks'); console.log('Detailed Guild matrix: '+r.metadata.largeMonsters+' large monsters × '+r.metadata.ranks.length+' ranks = '+r.results.length+' rank-matchups.');" "$RUNNER_TEMP/bow-elemental-monsters-guild.json"
          node tools/summarize-bow-monster-matrix.mjs "$RUNNER_TEMP/bow-elemental-monsters-guild.json" "$RUNNER_TEMP/bow-elemental-summary-guild.json" > /dev/null
          node -e "const r=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); const rows=r.rows.filter(x=>x.scenario==='base' && x.profile==='elementalFull' && x.shotType!=='ALL'); const hybrid=r.rows.filter(x=>x.scenario==='base' && x.profile==='elementalHybrid' && x.shotType!=='ALL'); const low=r.rows.filter(x=>x.scenario==='base' && x.profile==='elementalHybridLowCost' && x.shotType!=='ALL'); const types=['Rapid','Pierce','Spread','Heavy']; for(const rank of ['LR','HR','G']) for(const type of types){const row=rows.find(x=>x.rank===rank && x.shotType===type); const h=hybrid.find(x=>x.rank===rank && x.shotType===type); const l=low.find(x=>x.rank===rank && x.shotType===type); if(!row||!h||!l) throw new Error('Missing '+rank+'/'+type+' Element Full or hybrid subgroup');} if(hybrid.length!==12 || low.length!==12) throw new Error('Expected 12 rows for each hybrid profile'); console.log('Guild type-constrained summaries verified: '+rows.length+' Element Full + '+hybrid.length+' max hybrid + '+low.length+' low-cost hybrid rows.');" "$RUNNER_TEMP/bow-elemental-summary-guild.json"
      - name: Run detailed Guild matrix with elemental cap 30
        run: |
          node tools/bow-elemental-scenarios.mjs --hitzones="$RUNNER_TEMP/mhgu-hitzones.js" --style=guild --element-cap=30 --monster-summary > "$RUNNER_TEMP/bow-elemental-monsters-guild-cap30.json"
          node tools/summarize-bow-monster-matrix.mjs "$RUNNER_TEMP/bow-elemental-monsters-guild-cap30.json" "$RUNNER_TEMP/bow-elemental-summary-guild-cap30.json" > /dev/null
          node -e "const fs=require('node:fs'); const base=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const cap=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); if(cap.metadata.options.elementCap!==30) throw new Error('Element cap metadata must equal 30'); const profiles=['elementalFull','elementalFull50','elementalFocused','elementalFocused50','elementalHybrid','elementalHybrid50','elementalHybridLowCost','elementalHybridLowCost50']; let count=0; for(const rank of ['LR','HR','G']) for(const scenario of ['base','A','B']) for(const profile of profiles) for(const shotType of ['Rapid','Pierce','Spread','Heavy']) { const key=x=>x.rank===rank&&x.scenario===scenario&&x.profile===profile&&x.shotType===shotType; const a=base.rows.find(key), b=cap.rows.find(key); if(!a||!b) continue; count++; const fmt=x=>x==null?'n/a':x.toFixed(3); console.log(rank+'/'+scenario+'/'+profile+'/'+shotType+' ratio '+fmt(a.partMeanRatio)+' -> '+fmt(b.partMeanRatio)+' (delta '+fmt(b.partMeanRatio-a.partMeanRatio)+') | favorable '+fmt(a.partFavorable25Plus.meanRatio)+' -> '+fmt(b.partFavorable25Plus.meanRatio)); } if(count===0) throw new Error('No comparable capped summaries'); console.log('Compared '+count+' rank/scenario/profile/shot-type groups.');" "$RUNNER_TEMP/bow-elemental-summary-guild.json" "$RUNNER_TEMP/bow-elemental-summary-guild-cap30.json"
      - name: Run detailed monster matrix with Valor style
        run: |
          node tools/bow-elemental-scenarios.mjs --hitzones="$RUNNER_TEMP/mhgu-hitzones.js" --style=valor --monster-summary > "$RUNNER_TEMP/bow-elemental-monsters-valor.json"
          node -e "const r=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); if(r.metadata.largeMonsters!==93 || r.results.length!==279) throw new Error('Expected 93 monsters × 3 ranks'); console.log('Detailed Valor matrix: '+r.metadata.largeMonsters+' large monsters × '+r.metadata.ranks.length+' ranks = '+r.results.length+' rank-matchups.');" "$RUNNER_TEMP/bow-elemental-monsters-valor.json"
          node tools/summarize-bow-monster-matrix.mjs "$RUNNER_TEMP/bow-elemental-monsters-valor.json" "$RUNNER_TEMP/bow-elemental-summary-valor.json" > /dev/null
          node -e "const r=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); const rows=r.rows.filter(x=>x.scenario==='base' && x.profile==='elementalFull' && x.shotType!=='ALL'); const focus=r.rows.filter(x=>x.scenario==='base' && x.profile==='elementalFocused' && x.shotType!=='ALL'); const hybrid=r.rows.filter(x=>x.scenario==='base' && x.profile==='elementalHybrid' && x.shotType!=='ALL'); const low=r.rows.filter(x=>x.scenario==='base' && x.profile==='elementalHybridLowCost' && x.shotType!=='ALL'); if(rows.length!==12 || focus.length!==12 || hybrid.length!==12 || low.length!==12) throw new Error('Expected 12 type-constrained rows for Element Full, Focus, max and low-cost hybrid'); console.log('Valor type-constrained summaries verified: '+rows.length+' Element Full + '+focus.length+' Element Focus + '+hybrid.length+' max hybrid + '+low.length+' low-cost hybrid rows.');" "$RUNNER_TEMP/bow-elemental-summary-valor.json"


      - name: Audit all bow families and Load Up transitions
        run: |
          node tools/bow-branch-audit.mjs --out="$RUNNER_TEMP/bow-branch-audit-stage5.json" --summary
          node -e "const r=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); const m=r.metadata; if(m.segmentCount!==107 || m.totalLevelRecords!==735 || m.rootFamilyCount!==59 || m.lineEndpointCount!==107 || m.graphLeafSegmentCount!==78) throw new Error('Unexpected bow catalogue topology: '+JSON.stringify(m)); if(m.branchRoles.elemental!==55 || m.branchRoles.raw!==46 || m.branchRoles.blast!==6) throw new Error('Unexpected segment-endpoint roles: '+JSON.stringify(m.branchRoles)); if(m.loadUp.marked!==674 || m.loadUp.mismatches!==441) throw new Error('Unexpected Load Up counts: '+JSON.stringify(m.loadUp)); console.log('Verified '+m.lineEndpointCount+' line endpoints ('+m.graphLeafSegmentCount+' graph leaves) across '+m.rootFamilyCount+' families; roles='+JSON.stringify(m.branchRoles)+'; Load Up normalization='+m.loadUp.mismatches+'/'+m.loadUp.marked+'.');" "$RUNNER_TEMP/bow-branch-audit-stage5.json"

      - name: Run full bow catalogue scenario smoke test
        run: |
          node tools/bow-elemental-scenarios.mjs --summary > "$RUNNER_TEMP/bow-scenarios.json"
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/bow-scenarios.json"

      - name: Audit actual G-rank bow skill sources
        run: |
          node tools/bow-build-feasibility-audit.mjs --rank G --out="$RUNNER_TEMP/bow-build-feasibility-stage7.json"
          node -e "const r=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); const m=r.metadata; if(m.eligibleGunnerArmorPieces<1000 || r.weaponCatalog.levelRecords!==735 || r.packages.length!==68) throw new Error('Unexpected armor/weapon audit inventory'); if(!r.skillAvailability.Loading || !r.skillAvailability['Ammo Saver']) throw new Error('Optional skills missing from availability report'); if(r.skillAvailability['Elem C+'].targets.some(x=>x.armor.pieceCount!==0)) throw new Error('Elem C+ armor availability changed unexpectedly'); console.log('Verified '+m.eligibleGunnerArmorPieces+' G-rank Gunner/All armor pieces, '+r.weaponCatalog.levelRecords+' bow levels and '+r.packages.length+' skill packages.');" "$RUNNER_TEMP/bow-build-feasibility-stage7.json"

      - name: Upload reproducible bow balance results
        uses: actions/upload-artifact@v4
        with:
          name: bow-balance-stage5-results
          path: |
            ${{ runner.temp }}/bow-balance-stage5.json
            ${{ runner.temp }}/bow-balance-stage5.log
            ${{ runner.temp }}/bow-scenarios.json
            ${{ runner.temp }}/bow-elemental-monsters-guild.json
            ${{ runner.temp }}/bow-elemental-monsters-valor.json
            ${{ runner.temp }}/bow-elemental-summary-guild.json
            ${{ runner.temp }}/bow-elemental-summary-guild-cap30.json
            ${{ runner.temp }}/bow-elemental-summary-valor.json
            ${{ runner.temp }}/bow-branch-audit-stage5.json
            ${{ runner.temp }}/bow-build-feasibility-stage7.json
          retention-days: 14
